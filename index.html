<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>🎮 Game Hub</h1>
        <input id="search" type="text" placeholder="Search games...">
    </header>

    <main id="games">
        <button onclick="openGame('games/game1/index.html')">
            Game 1
        </button>

        <button onclick="openGame('games/game2/index.html')">
            Game 2
        </button>
    </main>

    <div id="gameWindow" class="hidden">
        <button onclick="closeGame()">← Back</button>
        <iframe id="gameFrame"></iframe>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
